const D=[
["Língua Portuguesa","Interpretação::Identifique tema, ideia central e o que está implícito (inferência). Releia o texto antes de marcar.|Gêneros do discurso::Cada gênero tem finalidade, público, suporte e linguagem própria (notícia informa, carta solicita, charge critica).|Funções sintáticas::O papel do termo na oração (sujeito, objeto, adjunto). Mudar a função muda o sentido.|Variação linguística::Diferenças regionais, sociais e de situação. Não é erro: é adequação ao contexto.|Coesão::Conectivos ligam ideias e indicam relação: oposição (porém), causa (pois), conclusão (logo), adição (além disso).|Argumentação::Tese + argumentos que a sustentam. Contra-argumento rebate ou reconhece a ideia oposta.|Vozes sociais::Quem fala no texto: citações, ironia, discurso de grupos sociais.|Discurso oral::Entonação, gestos e pausas ajudam o sentido; a fala muda conforme a situação (formal ou informal).|Modalizadores::Palavras que mostram a posição do autor: talvez, certamente, infelizmente.|Período simples::Uma só oração (um verbo). Observe sujeito, complementos e adjuntos para entender o sentido."],
["Literaturas","Gregório de Matos (Barroco)::Poesia religiosa, amorosa e satírica. Conflito entre fé e prazer, culpa e antíteses.|Gonzaga e Cláudio Manuel (Arcadismo)::Vida simples no campo, pastores, natureza serena, amor idealizado (Marília, Nise). Gonzaga: Marília de Dirceu.|Camões (Classicismo)::Sonetos sobre amor contraditório, passagem do tempo e mudança. Amor é fogo que arde sem se ver é exemplo de paradoxo.|Leminski::Poesia contemporânea curta, com humor, jogo de palavras e influência concreta.|Veríssimo::Crônicas humorísticas do cotidiano, com ironia e crítica social.|Pepetela::Fábula angolana, com alegoria sobre cooperação, poder e recursos (água).|Ana Maria Machado::Narrativa juvenil. Foque em narrador, personagens, tempo e espaço.|Dica::Leia as obras completas e observe gênero, época, características e figuras de linguagem."],
["Língua Inglesa","Leitura::Ideia principal, detalhes, inferência e texto verbal e não verbal (memes, tiras, anúncios, infográficos).|Present: simple e continuous::Simple = hábito (I study daily). Continuous = agora (I am studying).|Past: simple e continuous::Simple = ação concluída. Continuous = ação em andamento no passado.|Futuro::Will = previsão ou decisão na hora. Going to = plano.|Imperative::Ordem ou instrução (Open the door).|There to be::Existência: there is/are, there was/were.|Question words::What, who, where, when, why, how.|Preposições::in (meses, anos), on (dias), at (horas).|Quantifiers::Countable: many, few. Uncountable: much, little. Ambos: some, a lot of.|Pronomes, artigos e plural::I/my, a/an/the. Plural: -s, -es, irregulares (child, children)."],

["Educação Física","Jogos cooperativos::Todos ganham juntos, ao contrário dos competitivos (adversário).|Dança de salão::Expressão corporal e social em par.|Ginástica de condicionamento::Exercícios para saúde e preparo físico, com objetivos diferentes.|Esporte plural::Esporte como cultura: educação, lazer e rendimento. Mídias digitais podem gerar alienação.|Lutas::Cultura de movimento, com respeito, disciplina e valores na escola."],
["Filosofia","Origem da filosofia::Surge na Grécia ao explicar o mundo pela razão (logos), não pelo mito. Sofistas (retórica) x Sócrates (diálogo, dialética). Platão: teoria das ideias.|Teoria do conhecimento::Ceticismo: duvida que se conheça. Racionalismo: conhecimento vem da razão. Empirismo: vem da experiência. Idealismo transcendental (Kant): síntese entre experiência e razão.|Lógica::Dedução (do geral ao particular), indução (do particular ao geral), abdução (melhor explicação). Silogismo: duas premissas e uma conclusão. Falácia é raciocínio com erro."],

["História","Grécia::Pólis (cidade-Estado). Atenas: democracia limitada (excluía mulheres, escravos, estrangeiros). Esparta: militarista.|Roma::Da República ao Império, expansão por conquistas, escravidão e crise do século III.|Idade Média::Feudalismo: terra, servidão, vassalagem. Poder da Igreja. Economia agrária. Cultura religiosa.|Transição para o mundo moderno::Crise feudal, burguesia, Estados nacionais com rei forte. Grandes navegações e comércio.|Brasil colonial::Economia (pau-brasil, açúcar, ouro), escravidão, capitanias, governo-geral e sociedade.|Paraná::Povos indígenas, europeus e africanos, economia, trabalho e conflitos na colonização."],
["Sociologia","Imaginação sociológica::Relacionar a vida pessoal ao contexto social. Indivíduo e sociedade se influenciam.|Interações e identidades::Ações individuais e coletivas, e como construímos identidades sociais.|Socialização::Aprendemos normas e valores na família, escola e mídia. Juventude é categoria social, não só idade.|Trabalho::Divisão social do trabalho e modos de organização atuais (precarização, tecnologia)."],
["Matemática","Matrizes::Tabela de linhas × colunas. Soma: termo a termo. Produto: linha × coluna (colunas da 1ª = linhas da 2ª). Inversa: A·A⁻¹ = I.|Sistemas lineares::Conjunto de equações. Resolva por substituição, soma ou escalonamento. Podem ter solução única, infinitas ou nenhuma.|Números reais::Racionais (fração) e irracionais (π, √2). Intervalos e desigualdades.|Medidas::Conversão (km→m, m²→cm², L→m³). Armazenamento: 1 byte = 8 bits; 1 KB = 1024 B. Notação científica: a × 10ⁿ.|Matemática financeira::Regra de três, proporção, porcentagem. Juros simples: J = C·i·t. Compostos: M = C(1+i)ᵗ. Médias: aritmética, ponderada, geométrica.|Estatística::Média, mediana (valor central) e moda (mais frequente). Variância e desvio-padrão medem dispersão. Treine ler gráficos e tabelas."],
["Biologia","Seres vivos::Células, metabolismo, reprodução, hereditariedade, evolução. Níveis: célula → tecido → órgão → sistema → organismo.|Origem da vida::Hipóteses: abiogênese x biogênese (Pasteur) e evolução química (Oparin, Miller).|Composição química::Água, sais, carboidratos, lipídios, proteínas e ácidos nucleicos.|Célula::Membrana controla trocas, citoplasma tem organelas, núcleo guarda o DNA.|Metabolismo energético::Respiração celular e fermentação produzem ATP. Fotossíntese e quimiossíntese produzem matéria orgânica.|DNA, RNA e proteínas::DNA → RNA (transcrição) → proteína (tradução). Cariótipo: cromossomos de uma pessoa (46).|Divisão celular::Mitose: 2 células iguais (crescimento). Meiose: 4 células com metade dos cromossomos (gametas).|Reprodução::Assexuada (um indivíduo) e sexuada (gametas). Sistemas genitais, fecundação, contraceptivos e IST.|Histologia::Epitelial (reveste), conjuntivo (sustenta), muscular (move), nervoso (conduz impulsos)."],
["Física","Grandezas e SI::Escalar tem só valor (massa). Vetorial tem valor, direção e sentido (força). SI: m, kg, s.|MU::Velocidade constante: S = S₀ + v·t.|MUV::Aceleração constante: v = v₀ + a·t; S = S₀ + v₀t + at²/2; v² = v₀² + 2aΔS.|Queda livre e projéteis::Aceleração g ≈ 10 m/s². No lançamento oblíquo, horizontal é MU e vertical é MUV.|MCU::v = 2πR/T, f = 1/T. Aceleração centrípeta: a = v²/R.|Leis de Newton::Inércia, F = m·a, ação e reação (pares atuam em corpos diferentes).|Forças::Peso P = m·g. Normal perpendicular à superfície. Atrito: f = μN. Elástica: F = kx.|Gravitação e Kepler::F = G·M·m/d². Órbitas elípticas e planetas mais próximos do Sol são mais rápidos.|Momento linear::Q = m·v. Impulso I = F·Δt = ΔQ. Conserva-se em sistemas isolados.|Energia::Cinética mv²/2; potencial gravitacional mgh; trabalho W = F·d·cosθ; potência P = W/t. Energia mecânica se conserva sem atrito.|Equilíbrio e máquinas::Força resultante e momento resultante zero. Polias e alavancas reduzem a força aplicada."],
["Química","Estados da matéria::Sólido, líquido, gasoso e mudanças de fase (fusão, vaporização, sublimação).|Substâncias e misturas::Pura (simples ou composta) x mistura (homogênea ou heterogênea). Separação: filtração, decantação, destilação.|Modelos atômicos::Dalton (bola) → Thomson (pudim) → Rutherford (núcleo) → Bohr (níveis de energia).|Tabela periódica::Grupos (colunas) e períodos (linhas). Metais, não metais, gases nobres. Raio e eletronegatividade variam em padrões.|Ligações::Iônica (metal + ametal, transfere elétrons). Covalente (ametais, compartilha). Metálica (metais).|Interações intermoleculares::Dipolo induzido (apolar), dipolo-dipolo (polar), ligação de hidrogênio (H com F, O, N): a mais forte.|Radioatividade::Alfa (α), beta (β) e gama (γ). Meia-vida: tempo para a amostra cair à metade.|Cálculos químicos::Balanceie equações. Mol = 6,02×10²³ partículas. Estequiometria: proporção em mols entre reagentes e produtos. Lei de Lavoisier: massa se conserva.|Funções inorgânicas::Ácidos liberam H⁺. Bases liberam OH⁻. Sal vem da neutralização ácido + base. Óxidos: elemento + oxigênio."]

const E=[["Matemática","Matrizes::Tabela de m linhas e n colunas; aij é o elemento da linha i, coluna j. Soma e subtração só entre matrizes do mesmo tamanho, termo a termo. Número × matriz multiplica todos os elementos. Produto A·B só existe se colunas de A = linhas de B; cada elemento é a soma dos produtos de uma linha de A por uma coluna de B. Não é comutativo (AB ≠ BA). Identidade I: 1 na diagonal, 0 fora. Inversa: A·A⁻¹ = I, existe só se det ≠ 0. Em 2×2 com [a b; c d]: det = ad − bc e A⁻¹ = (1/det)·[d −b; −c a].|Sistemas lineares::Escreva como A·X = B e resolva por substituição, adição ou escalonamento. SPD: uma solução. SPI: infinitas (sobra incógnita livre). SI: nenhuma (aparece algo como 0 = 5). Em sistemas 2×2 e 3×3, det da matriz dos coeficientes ≠ 0 garante solução única; det = 0 indica SPI ou SI.|Números reais::Naturais ⊂ inteiros ⊂ racionais ⊂ reais. Racional vira fração, decimal exato ou dízima periódica (0,333… = 1/3). Irracional: decimal infinito e não periódico (π, √2). Valor absoluto é a distância até o zero (−3 tem valor absoluto 3). Intervalos: [a, b] inclui os extremos, (a, b) não. Em desigualdades, multiplicar ou dividir por número negativo inverte o sinal.|Medidas::km→m ×1000; m→cm ×100. Área usa o fator ao quadrado (1 m² = 10⁴ cm²) e volume ao cubo (1 m³ = 1000 L). 1 h = 3600 s. 180° = π rad. Dados: 1 byte = 8 bits; 1 KB = 1024 bytes. Atenção: velocidade de transferência é em bits/s (8 Mbps = 1 MB/s). Notação científica: a × 10ⁿ com 1 ≤ a < 10. Algarismos significativos: os certos mais um duvidoso; o erro de uma medida costuma ser metade da menor divisão do instrumento.|Matemática financeira::Razão é a/b; proporção, a/b = c/d (multiplique em cruz). Regra de três direta: grandezas crescem juntas; inversa: uma cresce, outra diminui; composta: compare cada grandeza com a incógnita. Aumento de p%: multiplique por (1 + p/100); desconto: (1 − p/100). Aumentos sucessivos se multiplicam (10% e 10% dá 21%). Lucro = venda − custo. Juros simples: J = C·i·t (cresce em linha reta). Compostos: M = C·(1 + i)ᵗ (juros sobre juros). Média aritmética: soma ÷ quantidade; ponderada: soma de valor×peso ÷ soma dos pesos; geométrica: raiz n-ésima do produto. SAC: amortização constante e parcelas decrescentes; Price: parcelas constantes. IDH vai de 0 a 1 (renda, educação, longevidade). Inflação é a alta geral dos preços.|Estatística::Frequência absoluta: quantas vezes o valor aparece; relativa: a fração ou porcentagem do total. Média: soma ÷ quantidade. Mediana: valor central com dados em ordem (se for par, média dos dois do meio). Moda: valor mais frequente. Variância: média dos quadrados dos desvios em relação à média; desvio-padrão: sua raiz. Quanto maior, mais espalhados os dados. Em gráficos e tabelas, leia título, eixos, unidades e escala antes de responder."],["Física","Grandezas e SI::Medir é comparar com um padrão. SI: metro, quilograma, segundo. Prefixos: k = 10³, m = 10⁻³, μ = 10⁻⁶. Escalares têm só valor (massa, tempo, energia); vetoriais têm valor, direção e sentido (deslocamento, velocidade, aceleração, força). Em gráficos, inclinação e área têm significado: em v×t, inclinação = aceleração e área = deslocamento.|MU::Velocidade constante, aceleração zero: S = S₀ + v·t; gráfico S×t é reta. Velocidade média = ΔS/Δt. km/h ÷ 3,6 = m/s. Em problemas de encontro, iguale as posições.|MUV::Aceleração constante: v = v₀ + a·t; S = S₀ + v₀t + at²/2; v² = v₀² + 2a·ΔS (Torricelli, sem tempo). Acelerado: v e a com mesmo sinal; retardado: sinais opostos.|Queda livre e projéteis::Queda livre é MUV com a = g ≈ 10 m/s², sem ar; a massa não importa. No ponto mais alto, a velocidade vertical é zero. Lançamento oblíquo: na horizontal é MU (vx = v·cosθ), na vertical é MUV (vy = v·senθ). O alcance é máximo a 45°.|MCU e MCUV::No MCU a trajetória é circular e o módulo da velocidade é constante. Período T (uma volta), frequência f = 1/T, v = 2πR/T = ωR, ω = 2πf. Aceleração centrípeta a = v²/R, apontando ao centro. Polias ligadas por correia têm mesma v; no mesmo eixo, mesma ω. No MCUV, a velocidade angular varia de modo uniforme.|Leis de Newton::1ª (inércia): sem força resultante, o corpo fica em repouso ou em MU. 2ª: F = m·a (N = kg·m/s²). 3ª: ação e reação têm mesmo módulo e sentidos opostos, mas atuam em corpos diferentes, por isso não se anulam. Referencial inercial: sem aceleração.|Forças::Peso P = m·g (massa e peso são diferentes). Normal: perpendicular à superfície. Atrito f = μ·N (estático antes de deslizar; cinético depois, menor). Elástica: F = k·x (Hooke). Centrípeta não é força nova: é a resultante que aponta ao centro, F = m·v²/R. Plano inclinado: P·senθ puxa para baixo da rampa, P·cosθ equilibra a normal.|Gravitação e Kepler::F = G·M·m/d²: cai com o quadrado da distância. Campo gravitacional g = G·M/R². Kepler: 1ª, órbitas elípticas com o Sol em um foco; 2ª, áreas iguais em tempos iguais (o planeta é mais rápido perto do Sol); 3ª, T²/R³ é constante.|Momento linear::Q = m·v (vetor). Impulso I = F·Δt = ΔQ. Em sistema isolado, Q total se conserva (explosões e colisões). Colisão elástica conserva a energia cinética; inelástica perde parte; perfeitamente inelástica: os corpos seguem juntos. Centro de massa: posição média ponderada pelas massas.|Energia::Trabalho W = F·d·cosθ (joule). Cinética: mv²/2. Potencial gravitacional: m·g·h. Elástica: kx²/2. W da resultante = variação da cinética. Potência P = W/t (watt). Forças conservativas (peso, elástica) conservam a energia mecânica; o atrito dissipa. A energia não some, se transforma.|Equilíbrio e máquinas simples::Partícula em equilíbrio: soma das forças = 0. Corpo rígido: soma das forças = 0 e soma dos momentos = 0 (momento M = F·d). Alavanca: F₁·d₁ = F₂·d₂. Polia fixa só muda a direção; polia móvel divide a força por 2 e dobra o comprimento de corda puxado."],["Química","Estados da matéria::Sólido: forma e volume fixos, partículas ordenadas. Líquido: forma do recipiente, volume fixo. Gás: ocupa todo o espaço. Mudanças: fusão, solidificação, vaporização (evaporação, ebulição, calefação), condensação e sublimação. Em substância pura, a temperatura fica constante durante a mudança; em mistura, varia.|Substâncias e separação de misturas::Substância pura tem propriedades fixas (PF, PE, densidade). Mistura homogênea tem uma fase; heterogênea, mais de uma. Filtração: sólido de líquido. Decantação: líquidos que não se misturam ou sólido que sedimenta. Destilação simples: sólido dissolvido em líquido. Destilação fracionada: líquidos miscíveis com PE diferentes (petróleo). Também: separação magnética, peneiração, flotação, cristalização.|Modelos atômicos::Dalton: esfera maciça. Thomson: pudim de passas (elétrons na carga positiva). Rutherford: núcleo pequeno e denso com prótons, eletrosfera quase vazia. Bohr: elétrons em níveis de energia; ao saltar, absorvem ou emitem luz. Z = prótons; A = Z + nêutrons. Isótopos: mesmo Z; isóbaros: mesmo A; isótonos: mesmo nº de nêutrons. Cátion perdeu elétrons; ânion ganhou. Ordem de preenchimento: 1s 2s 2p 3s 3p 4s 3d.|Tabela periódica::18 grupos (colunas) e 7 períodos (linhas = nº de camadas). Nos grupos representativos, o grupo indica os elétrons de valência. Metais: brilho, condutores, maleáveis. Gases nobres: estáveis. Raio atômico cresce para baixo e para a esquerda; eletronegatividade e energia de ionização crescem para cima e para a direita.|Ligações químicas::Iônica: metal + ametal, há transferência de elétrons; sólido cristalino, PF alto, conduz quando fundido ou dissolvido. Covalente: ametais compartilham pares de elétrons (moléculas ou redes como o diamante). Metálica: cátions num mar de elétrons; conduz e é maleável. Regra do octeto: tendência a 8 elétrons na valência.|Polaridade e interações::Molécula é polar quando as diferenças de eletronegatividade não se anulam pela geometria (H₂O, NH₃); apolar quando se anulam (CO₂, CH₄). Forças intermoleculares: dipolo induzido (apolares, fraca), dipolo-dipolo (polares) e ligação de hidrogênio (H com F, O ou N, a mais forte). Quanto mais forte, maior o ponto de ebulição. Semelhante dissolve semelhante.|Radioatividade::Núcleos instáveis emitem radiação. Alfa (α): 2 prótons + 2 nêutrons (Z−2, A−4). Beta (β): elétron (Z+1, A igual). Gama (γ): onda sem massa. Meia-vida: tempo para a amostra cair à metade (após n meias-vidas, N₀/2ⁿ). Transmutação pode ser natural ou artificial. Benefícios: medicina, datação (carbono-14), energia. Riscos: radiação e lixo nuclear.|Cálculos químicos::Balanceie por tentativas: metais, ametais, e por último H e O. Tipos: síntese, decomposição, simples troca e dupla troca. Lavoisier: a massa se conserva. Proust: proporções fixas. Massa molar (g/mol) é a soma das massas atômicas; 1 mol = 6,02×10²³ entidades; gás nas CNTP: 22,4 L/mol. Estequiometria: os coeficientes dão a proporção em mols; use regra de três.|Funções inorgânicas::Ácidos liberam H⁺ em água (HCl, H₂SO₄), sabor azedo, fenolftaleína incolor. Bases liberam OH⁻ (NaOH), fenolftaleína rosa. Neutralização: ácido + base → sal + água. Sal: cátion da base + ânion do ácido (NaCl). Óxidos: oxigênio + outro elemento (CO₂ é ácido, CaO é básico). Chuva ácida vem de SO₂ e NO₂. Ácidos e bases fortes conduzem bem a eletricidade em solução."]];
E.push(["Biologia","Seres vivos::Têm células, metabolismo, reprodução, hereditariedade (DNA), resposta a estímulos, homeostase e capacidade de evoluir. Níveis de organização: átomo → molécula → organela → célula → tecido → órgão → sistema → organismo → população → comunidade → ecossistema → biosfera. Método científico: observação, hipótese, experimento e conclusão.|Origem da vida::Abiogênese (geração espontânea) foi refutada por Redi (larvas na carne) e Pasteur (frasco pescoço de cisne), firmando a biogênese. Oparin e Haldane: na Terra primitiva (CH₄, NH₃, H₂ e vapor, com raios e calor) surgiram moléculas orgânicas; Miller e Urey reproduziram isso em 1953 e obtiveram aminoácidos. Ordem provável: heterótrofos anaeróbios → autótrofos (fotossíntese libera O₂) → aeróbios. Panspermia: a vida teria vindo do espaço.|Composição química::Água: solvente, regula temperatura (cerca de 70% da célula). Sais minerais: ossos (Ca), hemoglobina (Fe), impulso nervoso (Na⁺, K⁺). Carboidratos: energia (glicose), reserva (amido, glicogênio), estrutura (celulose, quitina). Lipídios: reserva, membrana, hormônios (colesterol). Proteínas (cadeias de aminoácidos): enzimas, anticorpos, estrutura; desnaturam com calor e pH extremo. Enzimas são catalisadores específicos (chave-fechadura). Ácidos nucleicos: DNA e RNA.|Nutrição e necessidades alimentares::Nutrientes energéticos (carboidratos, lipídios), construtores (proteínas, sais) e reguladores (vitaminas, água). Falta de vitamina C causa escorbuto; de D, raquitismo; de A, cegueira noturna; de ferro, anemia; de iodo, bócio.|Componentes celulares::Procarionte: sem núcleo (bactérias). Eucarionte: com núcleo. Membrana plasmática (mosaico fluido): transporte passivo (difusão, osmose, difusão facilitada, sem gasto de ATP) e ativo (contra o gradiente, gasta ATP, bomba Na⁺/K⁺); endocitose e exocitose. Citoplasma: ribossomos (síntese de proteínas), retículo rugoso e liso, complexo golgiense (empacota), lisossomos (digestão), mitocôndrias (respiração), cloroplastos, vacúolos, centríolos; parede celular em plantas e fungos. Núcleo: carioteca, nucléolo, cromatina (DNA).|Respiração e fermentação::Respiração aeróbia: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energia (cerca de 30 a 38 ATP). Etapas: glicólise (citoplasma), ciclo de Krebs (matriz mitocondrial) e cadeia respiratória (cristas, onde se forma a maior parte do ATP). Fermentação (sem O₂, 2 ATP): láctica (músculo, iogurte) e alcoólica (leveduras: pão, cerveja, etanol e CO₂).|Fotossíntese e quimiossíntese::6CO₂ + 6H₂O + luz → C₆H₁₂O₆ + 6O₂. Fase clara (tilacoides): luz quebra a água, libera O₂ e forma ATP e NADPH. Fase escura, ciclo de Calvin (estroma): fixa CO₂ e produz glicose. Quimiossíntese: bactérias usam energia de reações com compostos inorgânicos (enxofre, ferro, nitrogênio), sem luz.|DNA, RNA e síntese proteica::DNA: dupla hélice, desoxirribose, bases A-T e C-G. RNA: fita simples, ribose, U no lugar de T (mRNA, tRNA, rRNA). Replicação é semiconservativa. Transcrição (núcleo): DNA → mRNA. Tradução (ribossomo): cada códon (3 bases) corresponde a um aminoácido; AUG inicia; UAA, UAG e UGA terminam. Mutação é alteração no DNA.|Cariótipo humano::46 cromossomos: 22 pares de autossomos + 1 par sexual (XX mulher, XY homem). Alterações: síndrome de Down (trissomia do 21), Turner (45,X), Klinefelter (47,XXY).|Divisão celular::Ciclo: interfase (G1, S com duplicação do DNA, G2) e divisão. Mitose (prófase, metáfase, anáfase, telófase): 2 células idênticas, crescimento e reparo. Meiose: 2 divisões, 4 células com metade dos cromossomos (n); crossing-over na prófase I gera variabilidade; forma gametas. Câncer é divisão celular descontrolada.|Reprodução::Assexuada: um genitor, filhos idênticos (divisão binária, brotamento, fragmentação, esporos). Sexuada: gametas, variabilidade. Masculino: testículos (espermatozoides e testosterona), epidídimo, ducto deferente, próstata, vesículas seminais, uretra. Feminino: ovários (óvulos, estrogênio e progesterona), tubas (fecundação), útero (gestação), vagina. Espermatogênese: 4 espermatozoides; ovulogênese: 1 óvulo e corpos polares. Ciclo de cerca de 28 dias, com ovulação por volta do 14º dia. Zigoto → mórula → blástula → nidação.|Contracepção e IST::Camisinha é o único método que também previne IST. Outros: pílula, DIU, diafragma, laqueadura, vasectomia. IST: HIV/aids, sífilis, gonorreia, clamídia, HPV (vacina), herpes, hepatite B (vacina).|Histologia::Epitelial: reveste e secreta, sem vasos sanguíneos. Conjuntivo: sustenta e preenche (sangue, ósseo, cartilaginoso, adiposo, frouxo). Muscular: estriado esquelético (voluntário), estriado cardíaco (involuntário), liso (involuntário). Nervoso: neurônios (dendritos recebem, axônio conduz, sinapse transmite) e células da glia.|Ciência e saúde::Vacinas treinam o sistema imunológico; antibióticos agem em bactérias, não em vírus; alimentação equilibrada e exercício previnem doenças; cuidado com automedicação."],["Literaturas","Como a prova cobra::Gênero, época, características, figuras de linguagem, elementos da narrativa (narrador, personagens, tempo, espaço) e da poesia (versos, rimas, ritmo). Leia os poemas e as obras indicadas.|Figuras e versificação::Metáfora, comparação, metonímia, antítese (ideias opostas), paradoxo (contradição aparente), hipérbole, ironia, eufemismo, personificação. Soneto: 14 versos (2 quartetos + 2 tercetos). Decassílabo: 10 sílabas poéticas, contadas até a última tônica. Redondilha maior: 7 sílabas.|Gregório de Matos (Barroco, séc. XVII)::Contrarreforma. Conflito entre fé e prazer, culpa, brevidade da vida; linguagem rebuscada, antíteses, paradoxos. Três faces: lírica religiosa (arrependimento, súplica a Deus), lírica amorosa e sátira social contra governantes, clero e elites da Bahia (apelido: Boca do Inferno). Identifique o tom de cada poema.|Arcadismo (séc. XVIII)::Iluminismo, volta aos clássicos. Bucolismo e pastoralismo (pastores, ninfas, campo), locus amoenus (lugar ameno), fugere urbem (fugir da cidade), carpe diem (aproveitar o dia), aurea mediocritas (vida simples), linguagem clara. Poetas usam pseudônimos arcádicos.|Tomás Antônio Gonzaga::Marília de Dirceu: liras em que o pastor Dirceu fala à amada Marília. Muda de tom ao longo da obra: felicidade amorosa e vida simples (início) → saudade, sofrimento e reflexão (preso por conta da Inconfidência Mineira). Há idealização da mulher e do campo.|Cláudio Manuel da Costa::Transição entre Barroco e Arcadismo. Soneto, pastoral, Nise como musa. Contraste entre o ideal pastoril e a paisagem áspera de Minas; tom melancólico e tema do tempo e da dor.|Camões (Classicismo)::Renascimento, influência de Petrarca. Medida nova (soneto decassílabo) e velha (redondilhas). Temas: amor contraditório (Amor é fogo que arde sem se ver: paradoxos), mudança do tempo (Mudam-se os tempos, mudam-se as vontades), saudade, desconcerto do mundo, platonismo e lamento pela amada morta.|Paulo Leminski::Poeta paranaense, contemporâneo. Poemas curtos, humor, jogos de palavras, ecos do haicai e do concretismo, metalinguagem e temas como amor, tempo e vida.|Luís Fernando Veríssimo::Crônica: gênero entre jornalismo e literatura, linguagem simples e coloquial, humor e ironia sobre o cotidiano e os costumes. Observe a crítica de comportamento e o final inesperado.|Pepetela e Ana Maria Machado::Pepetela (Angola): fábula, com personagens-animais e moral (cooperação e partilha de recursos); leitura alegórica da sociedade. Ana Maria Machado: narrativa juvenil; analise narrador, personagens, tempo, espaço e tema. Leia ambas na íntegra."]);
E.push(["Língua Portuguesa","Interpretação de textos::Ache o tema (assunto) e a ideia central (o que o autor defende). Separe o que está dito (explícito) do que se conclui (inferência). Em questões, volte ao trecho, cuidado com alternativas que extrapolam o texto ou usam palavras absolutas (sempre, nunca, todos). Observe título, imagens, legenda e fonte.|Gêneros do discurso::Cada gênero tem finalidade, público, suporte, estrutura e linguagem. Notícia informa (3ª pessoa, fatos); reportagem aprofunda; artigo de opinião defende ponto de vista; carta de solicitação pede algo de modo formal; charge e tira usam humor e crítica; propaganda persuade; receita instrui. Condições de produção: quem escreve, para quem, onde circula, com que objetivo.|Funções sintáticas::Sujeito (quem pratica ou sobre quem se declara), predicado, objeto direto (sem preposição) e indireto (com preposição), adjunto adnominal (modifica substantivo), adjunto adverbial (circunstância: tempo, lugar, modo), complemento nominal, predicativo (característica do sujeito), aposto (explica) e vocativo (chama). Mudar a função muda o sentido: Maria é dona da casa x Maria dona da casa chegou.|Variação linguística::Língua muda por região (dialetos), grupo social (gírias, jargões), situação (formal, informal), época e modalidade (fala e escrita). Não existe erro, existe inadequação ao contexto. Norma-padrão é uma variedade de prestígio, exigida em situações formais. Preconceito linguístico é julgar quem fala diferente.|Coesão::Conectivos ligam ideias e indicam relação: adição (e, além disso), oposição (mas, porém, contudo), causa (porque, pois), conclusão (logo, portanto), condição (se), finalidade (para que), tempo (quando, enquanto), concessão (embora, apesar de). Referenciação: pronomes e sinônimos retomam termos (ele, essa, tal) e evitam repetição.|Argumentação::Tese é a ideia defendida. Argumentos a sustentam: exemplos, dados, autoridade, causa e consequência, comparação. Contra-argumento antecipa ou rebate a ideia contrária; a concessão reconhece um ponto do outro lado antes de rebater (É verdade que…, mas…).|Vozes sociais::Todo texto traz vozes de outros: citações, discurso direto e indireto, aspas, ironia, paródia, referência a grupos (jovens, políticos, especialistas). Pergunte: quem fala? de que lugar social? a quem responde?|Discurso oral::Entonação, pausas, gestos, olhar e ritmo constroem o sentido. Marcas da fala: hesitações, repetições, gírias, interrupções. A fala se adapta ao interlocutor e ao contexto (conversa, entrevista, palestra, jornal de TV).|Modalizadores::Mostram a atitude do autor: certeza (certamente, sem dúvida), dúvida (talvez, provavelmente), obrigação (é preciso, deve), avaliação (infelizmente, felizmente), e verbos como parecer ou poder. Revelam opinião e atenuam ou reforçam o que se diz.|Período simples::Tem só um verbo (uma oração). Estrutura: sujeito + predicado + complementos + adjuntos. Concordância do verbo com o sujeito. A ordem dos termos e a pontuação mudam o sentido: Vamos comer, crianças x Vamos comer crianças."],["História","Grécia: pólis::Cidades-Estado independentes (Atenas, Esparta). Atenas: democracia direta na assembleia (Eclésia); cidadãos eram só homens livres e filhos de atenienses, excluindo mulheres, estrangeiros e escravos. Reformas de Sólon, Clístenes e Péricles. Esparta: oligárquica, militarista, com servos (hilotas). Cultura: filosofia, teatro, olimpíadas, mitologia.|Roma::Monarquia → República (Senado, cônsules, patrícios x plebeus, tribunos da plebe) → Império (Augusto, 27 a.C.). Expansão por guerras (Guerras Púnicas contra Cartago), escravidão em larga escala e política do pão e circo. Crise do século III: instabilidade política, guerras civis, crise econômica, fim das conquistas, invasões germânicas; levou à divisão do Império e à queda do Ocidente (476 d.C.).|Sociedade feudal::Séc. V ao XV. Ruralização, poder descentralizado nos senhores feudais. Estamentos: clero (reza), nobreza (luta), servos (trabalham); pouca mobilidade social. Servidão: o servo trabalha na terra do senhor, paga obrigações (corveia, talha, banalidades) e não pode sair. Suserania e vassalagem: laços de fidelidade entre nobres.|Economia medieval::Agrária e de subsistência, em feudos, com técnicas como rotação trienal. A partir do séc. XI, com o fim das invasões, há crescimento populacional, renascimento comercial e urbano, burgos, feiras, corporações de ofício e moeda.|Estado e Igreja::A Igreja Católica concentrava poder espiritual, econômico (terras) e cultural. Cruzadas, Inquisição, excomunhão, dízimo. Reis disputavam poder com o papa. Pouco a pouco o poder real se fortalece.|Cultura e saber::Teocentrismo (Deus no centro). Mosteiros guardavam livros; universidades surgem (Bolonha, Paris). Escolástica (Tomás de Aquino): conciliar fé e razão. Arte românica e gótica. Cultura muçulmana e bizantina também influenciaram.|Crise e Estados nacionais::Séc. XIV: fome, Peste Negra, Guerra dos Cem Anos, revoltas camponesas. Burguesia fortalecida pelo comércio financia reis; alianças levam à centralização e aos Estados nacionais (Portugal, Espanha, Inglaterra, França) e ao absolutismo. Renascimento: antropocentrismo e racionalismo.|Grandes navegações::Séc. XV e XVI. Causas: busca de rotas para as Índias (especiarias) após a queda de Constantinopla (1453), centralização do poder, burguesia, avanços técnicos (caravela, bússola, astrolábio) e expansão da fé cristã. Portugal pioneiro (Sagres; Vasco da Gama chega às Índias em 1498; Cabral ao Brasil em 1500); Espanha (Colombo, 1492). Revolução comercial: mercantilismo, metalismo, monopólio, balança comercial favorável.|Brasil colonial::Pau-brasil (extração com indígenas, escambo) → capitanias hereditárias e governo-geral (1548) → açúcar (engenho, latifúndio, monocultura, escravidão africana) → pecuária no sertão → ouro em Minas (séc. XVIII: quinto, derrama, Casa de Intendência). Sociedade escravista e patriarcal, com poucos senhores e muitos escravizados. Resistências: quilombos (Palmares), revoltas, Inconfidência Mineira. Cultura: Barroco, catequese jesuítica.|História do Paraná::Povos originários (Kaingang, Guarani, Xetá) já viviam na região. Colonização espanhola (reduções jesuíticas, Guairá) e portuguesa: bandeirantes, mineração de ouro no litoral e Curitiba, tropeirismo e pecuária nos Campos Gerais, trabalho indígena e africano escravizado, migrações. Emancipação em 1853."],["Geografia","Conceitos geográficos::Espaço (produzido pela sociedade), paisagem (o que se vê), lugar (vivência e identidade), território (espaço com poder e limites) e região (área com características comuns). Ação antrópica é a transformação humana da natureza.|Localização e orientação::Pontos cardeais e colaterais. Coordenadas: latitude (paralelos, 0° a 90° N/S, Equador = 0°) e longitude (meridianos, 0° a 180° L/O, Greenwich = 0°). Trópicos de Câncer e Capricórnio, círculos polares.|Movimentos e fusos::Rotação (24 h): dia e noite. Translação (365 dias e 6 h): estações do ano, por causa da inclinação do eixo (23,5°); ano bissexto. Fusos: 24, de 15° cada (360° ÷ 24); a hora aumenta para leste e diminui para oeste. O Brasil tem 4 fusos (de GMT−2 a GMT−5); Brasília fica em GMT−3.|Cartografia::Escala = distância no mapa ÷ distância real (menor denominador = mais detalhe). Projeções (Mercator, Peters) distorcem. Mapas: físicos, políticos, temáticos. Legenda, curvas de nível (relevo), imagens de satélite, GPS, sensoriamento remoto.|Estrutura da Terra::Crosta, manto, núcleo externo (líquido) e interno (sólido). Placas tectônicas: convergentes (colisão: montanhas, subducção, vulcões), divergentes (afastam: dorsais) e transformantes (deslizam: terremotos, como na falha de San Andreas, na Califórnia). Círculo de Fogo do Pacífico. Brasil: estável, no meio de placa. Rochas: ígneas (magma), sedimentares (acúmulo, com fósseis e petróleo) e metamórficas (transformadas por calor e pressão).|Relevo::Planalto (erosão predomina), planície (acúmulo de sedimentos), depressão (abaixo do nível das áreas vizinhas) e montanha. Agentes internos: tectonismo, vulcanismo, abalos sísmicos. Externos: intemperismo (físico, químico, biológico) e erosão (água, vento, gelo, ser humano), formando voçorocas e assoreamento.|Clima::Tempo é o estado momentâneo; clima, o padrão de longo prazo. Fatores: latitude, altitude, maritimidade e continentalidade, correntes marítimas, massas de ar, relevo. Elementos: temperatura, umidade, pressão, chuvas. Circulação atmosférica: baixas pressões (chuva), altas (tempo seco), ventos alísios, monções. Fenômenos: El Niño (águas quentes no Pacífico, seca no Norte e Nordeste, chuva no Sul), La Niña, ilhas de calor, inversão térmica, chuva ácida, efeito estufa. Tipos: equatorial, tropical, semiárido, subtropical, temperado, polar, desértico.|Biomas::Dependem de clima e solo. Floresta Amazônica (equatorial, grande biodiversidade), Cerrado (savana, solos ácidos, berço das águas), Caatinga (semiárido), Mata Atlântica (muito desmatada; Paraná tem remanescentes), Pampa, Pantanal, tundra, taiga, florestas temperadas, desertos.|Solos e hidrografia::Solo vem da rocha-mãe, clima e organismos; problemas: erosão, lixiviação, laterização, desertificação, salinização. Hidrografia: bacia hidrográfica, rios (regime pluvial, nival), aquíferos (Guarani, o maior da América do Sul), lençol freático; poluição e escassez de água.|Recursos naturais::Renováveis (água, vento, sol, biomassa) e não renováveis (petróleo, carvão, minérios, gás). Energia: fósseis (poluem), hidrelétrica (alaga áreas, mas é renovável), nuclear (risco de acidentes e lixo), solar, eólica, biocombustíveis (etanol). Impactos: desmatamento, mineração, poluição, perda de biodiversidade, aquecimento global. Desenvolvimento sustentável atende o presente sem comprometer o futuro.|Paraná e o global::O estado se liga ao mundo por exportações de soja, milho, carne de frango e celulose, pelo porto de Paranaguá, pela Hidrelétrica de Itaipu e pelo Mercosul. Tem indústria automotiva na região de Curitiba e agroindústria e cooperativas no interior."]);
E.push(["Física","Grandezas e SI::Medir é comparar com um padrão. No Sistema Internacional usamos metro, quilograma e segundo. Prefixos (quilo, mili, micro) indicam múltiplos e submúltiplos. Grandeza escalar tem só valor (massa, tempo, energia); vetorial tem valor, direção e sentido (deslocamento, velocidade, aceleração, força). Em gráficos, a inclinação e a área têm significado: no gráfico de velocidade por tempo, a inclinação é a aceleração e a área é o deslocamento.|Movimento uniforme (MU)::Velocidade constante e aceleração nula. O gráfico da posição pelo tempo é uma reta; o da velocidade é horizontal. Para converter, km/h dividido por 3,6 dá m/s. Em problemas de encontro, iguale as posições dos dois móveis.|Movimento uniformemente variado (MUV)::Aceleração constante: a velocidade muda sempre pela mesma quantidade a cada segundo. Acelerado quando velocidade e aceleração têm o mesmo sinal; retardado quando têm sinais opostos. O gráfico da posição é uma parábola e o da velocidade é uma reta inclinada. Quando o problema não cita o tempo, use a equação de Torricelli.|Queda livre e projéteis::Na queda livre só age a gravidade (cerca de 10 m/s²), e a massa não influencia. No ponto mais alto de um lançamento vertical, a velocidade é zero. No lançamento oblíquo, o movimento se divide em dois: na horizontal é uniforme e na vertical é uniformemente variado. O alcance é máximo com 45°.|Movimento circular::No MCU a velocidade tem módulo constante, mas a direção muda, então existe aceleração centrípeta, apontando ao centro. O período é o tempo de uma volta e a frequência é o número de voltas por segundo. Duas polias ligadas por correia têm a mesma velocidade linear; no mesmo eixo, a mesma velocidade angular. No MCUV a velocidade angular varia uniformemente.|Leis de Newton::1ª (inércia): sem força resultante, o corpo fica parado ou em movimento uniforme. 2ª: a força resultante faz o corpo acelerar, e quanto maior a massa, menor a aceleração. 3ª: ação e reação têm mesmo valor e sentidos opostos, mas atuam em corpos diferentes, por isso não se anulam. Referencial inercial é aquele sem aceleração.|Forças::Peso é a força da gravidade (diferente de massa). Normal é perpendicular à superfície de contato. Atrito se opõe ao deslizamento: estático antes de deslizar, cinético depois, que é menor. Força elástica da mola é proporcional à deformação. Força centrípeta não é nova: é a resultante que aponta ao centro da curva. No plano inclinado, o peso se divide em uma componente que puxa para baixo da rampa e outra que equilibra a normal.|Gravitação e Kepler::Dois corpos se atraem com força que cai com o quadrado da distância: dobrando a distância, a força vira a quarta parte. Kepler: 1ª, órbitas elípticas com o Sol em um foco; 2ª, o planeta varre áreas iguais em tempos iguais (anda mais rápido perto do Sol); 3ª, quanto maior a órbita, maior o período.|Impulso e quantidade de movimento::Quantidade de movimento é massa vezes velocidade (vetor). Impulso é a força aplicada durante um intervalo de tempo e é igual à variação da quantidade de movimento. Em sistemas isolados ela se conserva (explosões, colisões). Colisão elástica conserva também a energia cinética; inelástica perde parte; perfeitamente inelástica termina com os corpos juntos.|Trabalho e energia::Trabalho é a força aplicada ao longo de um deslocamento; só a componente na direção do movimento realiza trabalho. Energia cinética depende da massa e do quadrado da velocidade. Potencial gravitacional depende da altura; elástica, da deformação da mola. Potência é a rapidez com que se realiza trabalho. Forças conservativas (peso, elástica) conservam a energia mecânica; o atrito a dissipa em calor. A energia total nunca desaparece, só se transforma.|Equilíbrio e máquinas simples::Partícula em equilíbrio tem resultante nula. Corpo rígido exige resultante nula e soma dos momentos (giros) nula. O momento depende da força e da distância ao ponto de giro. Alavanca: quanto mais longe do apoio, menos força é preciso fazer. Polia fixa só muda a direção da força; polia móvel reduz a força pela metade e dobra a corda puxada."],["Química","Estados da matéria::Sólido tem forma e volume fixos, com partículas ordenadas. Líquido tem volume fixo e toma a forma do recipiente. Gás ocupa todo o espaço disponível. Mudanças: fusão, solidificação, vaporização (evaporação, ebulição, calefação), condensação e sublimação. Em substância pura, a temperatura fica constante durante a mudança; em mistura, varia.|Substâncias e separação de misturas::Substância pura tem propriedades fixas (ponto de fusão, ebulição, densidade). Mistura homogênea tem uma fase; heterogênea, mais de uma. Filtração separa sólido de líquido. Decantação separa líquidos que não se misturam ou sólido que sedimenta. Destilação simples separa sólido dissolvido em líquido; fracionada, líquidos com pontos de ebulição diferentes (petróleo). Há também separação magnética, peneiração, flotação e cristalização.|Modelos atômicos::Dalton: esfera maciça. Thomson: pudim de passas, elétrons na carga positiva. Rutherford: núcleo pequeno e denso com prótons, eletrosfera quase vazia. Bohr: elétrons em níveis de energia, que ao saltar absorvem ou emitem luz. Número atômico é o de prótons; massa é prótons mais nêutrons. Isótopos têm mesmo número de prótons; isóbaros, mesma massa; isótonos, mesmo número de nêutrons. Cátion perdeu elétrons; ânion ganhou.|Tabela periódica::São 18 grupos (colunas) e 7 períodos (linhas, igual ao número de camadas). Nos grupos principais, o grupo indica os elétrons da última camada. Metais brilham, conduzem e são maleáveis; gases nobres são estáveis. O raio atômico aumenta para baixo e para a esquerda; eletronegatividade e energia de ionização aumentam para cima e para a direita.|Ligações químicas::Iônica: metal com ametal, há transferência de elétrons; sólido cristalino, ponto de fusão alto, conduz quando fundido ou dissolvido. Covalente: ametais compartilham elétrons. Metálica: cátions em um mar de elétrons, que explica a condução e a maleabilidade. Regra do octeto: átomos tendem a ficar com oito elétrons na última camada.|Polaridade e interações::Molécula é polar quando as diferenças de eletronegatividade não se anulam pela geometria (água, amônia); apolar quando se anulam (gás carbônico, metano). Interações: dipolo induzido (apolares, fraca), dipolo-dipolo (polares) e ligação de hidrogênio (H ligado a F, O ou N, a mais forte). Quanto mais forte a interação, maior o ponto de ebulição. Semelhante dissolve semelhante.|Radioatividade::Núcleos instáveis emitem radiação. Alfa: partícula pesada (2 prótons e 2 nêutrons), reduz o número atômico em 2 e a massa em 4. Beta: elétron, aumenta o número atômico em 1 e mantém a massa. Gama: onda, sem massa. Meia-vida é o tempo para a amostra cair à metade. Usos: medicina, datação por carbono-14, energia. Riscos: radiação e lixo nuclear.|Cálculos químicos::Balanceie por tentativas: metais, ametais e por último hidrogênio e oxigênio. Tipos de reação: síntese, decomposição, simples troca e dupla troca. Lavoisier: a massa se conserva. Proust: proporções fixas. Massa molar é a soma das massas atômicas. O mol é uma quantidade fixa de partículas (constante de Avogadro). Gases nas CNTP ocupam um volume molar fixo. Estequiometria: os coeficientes dão a proporção em mols; resolva com regra de três.|Funções inorgânicas::Ácidos liberam H⁺ em água, têm sabor azedo e deixam a fenolftaleína incolor. Bases liberam OH⁻ e deixam a fenolftaleína rosa. Neutralização: ácido mais base forma sal e água. Sal tem o cátion da base e o ânion do ácido. Óxidos: oxigênio com outro elemento (gás carbônico é ácido; óxido de cálcio é básico). Chuva ácida vem de óxidos de enxofre e nitrogênio."],["Filosofia","Origem da filosofia::Surge na Grécia ao buscar explicar o mundo pela razão (logos) em vez do mito. Pré-socráticos buscam o princípio (arché) de tudo: Tales (água), Anaxímenes (ar), Heráclito (fogo, tudo muda), Parmênides (o ser é imutável), Demócrito (átomos). Sofistas ensinam retórica e defendem que a verdade é relativa (Protágoras: o homem é a medida de todas as coisas). Sócrates: método do diálogo (ironia e maiêutica), conhecimento de si, virtude é saber. Platão: mundo sensível (aparência) e mundo das ideias (verdadeiro); mito da caverna; conhecimento como reminiscência. Aristóteles: lógica, observação da natureza, ato e potência; distingue ciência (conhecer) de técnica (produzir).|Argumentação e experimentos de pensamento::Argumento filosófico dá razões (premissas) para uma conclusão. Experimento de pensamento é uma situação imaginada para testar ideias (a caverna de Platão, o navio de Teseu, o anel de Giges).|Teoria do conhecimento::Pergunta se, como e até onde podemos conhecer. Conhecimento é crença verdadeira e justificada; evidência se distingue de opinião (doxa) e de senso comum. Ceticismo: suspender o juízo ou duvidar de que o conhecimento seja possível. Racionalismo: a razão é a fonte (Descartes, dúvida metódica e cogito). Empirismo: a experiência é a fonte (Locke, a mente é uma folha em branco; Hume). Kant (idealismo transcendental): conhecemos o que aparece a nós (fenômeno), pela síntese entre a intuição dos sentidos e os conceitos do entendimento.|Lógica elementar::Argumento tem premissas e conclusão. Válido: a conclusão decorre da forma das premissas. Correto (sólido): válido e com premissas verdadeiras. Dedução vai do geral ao particular e garante a conclusão; indução vai de casos à regra, só provável; abdução busca a melhor explicação. Lógica proposicional usa operadores: negação, conjunção (e), disjunção (ou), condicional (se… então) e bicondicional. Silogismo categórico: duas premissas e uma conclusão (todo homem é mortal; Sócrates é homem; logo…); o quadrado de oposições relaciona universais e particulares (contrárias, contraditórias, subcontrárias, subalternas).|Falácias::Formais: erro na estrutura do argumento (afirmação do consequente). Não formais: de relevância (ad hominem ataca a pessoa, apelo à autoridade, espantalho, falso dilema), semânticas (ambiguidade, equívoco) e indutivas (generalização apressada, amostra pequena, falsa causa)."],["Sociologia","Imaginação sociológica::É relacionar a vida pessoal ao contexto histórico e social (C. Wright Mills): problemas privados, como desemprego, também são problemas públicos. Pede estranhar o que parece natural (desnaturalizar) e evitar explicações apenas individuais ou do senso comum.|Indivíduo e sociedade::Um molda o outro. Durkheim: fato social é maneira de agir, pensar e sentir que é exterior ao indivíduo, geral e coercitiva. Weber: foca na ação social, com sentido dado pelo indivíduo. Marx: o ser humano é moldado pelas relações de produção e pela classe social.|Interações, sociabilidade e identidades::Interação é a relação entre pessoas; sociabilidade é o convívio em grupos. Identidade social se constrói em grupos (família, escola, religião, torcida, gênero, raça, classe) e muda ao longo da vida. Cada pessoa tem status (posição) e papel (comportamento esperado).|Ações individuais e coletivas::Ação individual é o que uma pessoa faz; coletiva envolve grupos que buscam um objetivo comum, como movimentos sociais, sindicatos e coletivos. Participação coletiva é fundamental para a cidadania e a mudança social.|Socialização::Primária: na infância, com a família, onde se aprende língua e valores. Secundária: na escola, no trabalho, na mídia, entre amigos. Instituições sociais (família, escola, religião, Estado, mídia) transmitem normas e exercem controle social. Socialização forma, mas pode gerar resistência.|Juventude como categoria social::Não é apenas idade: é uma construção histórica e cultural, vivida de modos diferentes conforme classe, gênero, raça e lugar. Existem culturas juvenis (estilos, músicas, redes) e desafios como acesso à educação, ao trabalho e à violência. Fala-se em juventudes, no plural.|Mundo do trabalho::Divisão social do trabalho: cada grupo faz uma função na sociedade. Divisão técnica: tarefas fragmentadas dentro da produção. Modelos: taylorismo (controle do tempo e do movimento), fordismo (linha de montagem, produção em massa) e toyotismo (produção flexível, sob demanda, trabalhador polivalente). Hoje: terceirização, informalidade, trabalho remoto, uberização e precarização, com impacto da tecnologia no emprego."],["Arte","Som, ruído e música::Som nasce de vibrações; ruído é som irregular; silêncio também faz parte da música. Parâmetros do som: altura (grave ou agudo), intensidade (forte ou fraco), timbre (a identidade do som) e duração.|Instrumentos musicais::Cordas (violão, violino), sopro (madeiras como flauta e clarinete; metais como trompete), percussão (tambor, pandeiro, xilofone) e eletrônicos (teclado, sintetizador). Também a voz e o corpo.|Música ocidental contemporânea::Século XX em diante: rompe com regras tradicionais. Dodecafonismo, minimalismo, música concreta e eletrônica; John Cage explora o silêncio e o acaso. Uso crescente de tecnologia.|Samba, bossa nova e rock::Samba: raízes afro-brasileiras, surgiu no Rio de Janeiro; instrumentos como pandeiro, tamborim e surdo. Bossa nova: final dos anos 1950, canto suave e harmonia sofisticada ao violão (João Gilberto, Tom Jobim, Vinicius de Moraes). Rock: anos 1950 nos EUA, com guitarra elétrica, baixo e bateria; Elvis, Beatles; no Brasil cresce nos anos 1980.|Arte moderna na América Latina::Rompe com o academicismo e valoriza a identidade latino-americana. Brasil: Semana de Arte Moderna de 1922 (Tarsila do Amaral, Anita Malfatti, Di Cavalcanti) e o movimento antropofágico. México: muralismo (Diego Rivera, Orozco, Siqueiros) e Frida Kahlo. Também Torres-García no Uruguai.|Arte contemporânea::Performance: o corpo e a ação são a obra, no momento presente. Videoarte: usa vídeo como linguagem. Instalação: obra que ocupa o espaço e envolve o público. Valoriza conceito e experiência mais que a técnica.|Arte e política::Arte como forma de denúncia e resistência. Movimento feminista (questiona o papel da mulher e a ausência de artistas mulheres), negro (identidade, memória e racismo), LGBT (diversidade e direitos) e indígena (território, cultura e resistência).|Teatro: improvisação e linguagem::Improvisação cria cena sem texto prévio, com jogos de experimentação do corpo, da voz e da ação. Elementos: jogo, ação, personagem e espaço cênico. Visualidades (cenário, figurino, iluminação), sonoridades (música, efeitos) e dramaturgias (texto e roteiro da cena).|Teatro: espectador e diversidade::Espectador também constrói o sentido da peça: a apreciação envolve sentir, interpretar e refletir. Teatro e cultura: manifestações populares (bumba meu boi, folia de reis, congada) e teatralidades negras, indígenas, feministas e LGBTQIAPN+.|Dança::Elementos: movimento do corpo, espaço (direções, níveis) e tempo (ritmo). Dança contemporânea: liberdade de movimento, improvisação, mistura de linguagens. Danças típicas brasileiras: frevo, maracatu, samba de roda, baião, catira, fandango, jongo, carimbó."],["Educação Física","Jogos cooperativos::Têm objetivo comum e ninguém é eliminado: todos jogam juntos para alcançar a meta. Nos competitivos, vence-se contra o adversário. Aplicações: escola, empresas, saúde, lazer e comunidades, para promover diálogo, confiança e inclusão.|Dança de salão::Danças em par, com condução e respeito mútuo: valsa, tango, bolero, forró, samba de gafieira, salsa. O movimento é meio de expressão do corpo e de convivência social.|Ginástica de condicionamento::Exercícios para saúde e preparo físico: ginástica aeróbica, step, musculação, funcional, pilates, alongamento. Trabalham capacidades como força, resistência, flexibilidade e velocidade. Cada tipo tem intenção diferente (saúde, estética, desempenho). Evitar o culto exagerado ao corpo e o uso de substâncias sem orientação.|Esporte plural::Esporte é fenômeno cultural. Esporte educação: formação e inclusão na escola. Esporte participação ou lazer: prática pelo prazer, sem foco no resultado. Esporte de rendimento: competição e desempenho. As mídias digitais transformam o esporte em espetáculo e podem alienar, estimulando consumo e apostas.|Lutas::Disputas corporais com regras, como judô, caratê, boxe, taekwondo e capoeira. Fazem parte da cultura de movimento, com história e origens variadas. Na escola trabalham respeito, disciplina, autocontrole e não violência; luta é diferente de briga."]);
D.splice(D.findIndex(d=>d[0]==="Matemática"),1);

<script>
const raw=String.raw`#Física
Velocidade média~v=\frac{\Delta S}{\Delta t}~v: velocidade (m/s) · ΔS: distância percorrida (m) · Δt: tempo (s). Dica: km/h ÷ 3,6 = m/s
MU: posição~S=S_0+v\,t~S: posição final · S₀: posição inicial · v: velocidade constante · t: tempo
MUV: velocidade~v=v_0+a\,t~v₀: velocidade inicial · a: aceleração · t: tempo
MUV: posição~S=S_0+v_0t+\frac{a\,t^2}{2}~Dá a posição em qualquer instante t
Torricelli~v^2=v_0^2+2a\,\Delta S~Use quando o problema não fala de tempo
Queda livre~h=\frac{g\,t^2}{2}\qquad v=g\,t~h: altura · g ≈ 10 m/s² · parte do repouso
Lançamento oblíquo~v_x=v\cos\theta\qquad v_y=v\,\mathrm{sen}\,\theta~Horizontal: MU. Vertical: MUV. θ: ângulo do lançamento
MCU~v=\frac{2\pi R}{T}=\omega R\qquad f=\frac{1}{T}~R: raio · T: período (s) · f: frequência (Hz) · ω: velocidade angular
Centrípeta~a_c=\frac{v^2}{R}\qquad F_c=\frac{m\,v^2}{R}~Aponta para o centro da curva
2ª Lei de Newton~F_R=m\,a~F_R: força resultante (N) · m: massa (kg) · a: aceleração (m/s²)
Peso~P=m\,g~Massa (kg) não é peso (N)
Atrito~f=\mu\,N~μ: coeficiente de atrito · N: força normal
Força elástica~F=k\,x~k: constante da mola · x: deformação
Plano inclinado~P_x=P\,\mathrm{sen}\,\theta\qquad P_y=P\cos\theta~Px puxa rampa abaixo; Py equilibra a normal (N = Py)
Gravitação~F=G\,\frac{M\,m}{d^2}~d: distância entre os centros. Dobrou d, a força cai a 1/4
3ª Lei de Kepler~\frac{T^2}{R^3}=\text{constante}~Quanto maior o raio da órbita, maior o período
Quantidade de movimento~Q=m\,v\qquad I=F\,\Delta t=\Delta Q~Q: momento linear · I: impulso (N·s)
Trabalho~W=F\,d\cos\theta~W em joules (J) · θ: ângulo entre a força e o deslocamento
Energia cinética~E_c=\frac{m\,v^2}{2}~Energia do movimento
Energia potencial gravitacional~E_p=m\,g\,h~Energia da altura
Energia potencial elástica~E_e=\frac{k\,x^2}{2}~Energia armazenada na mola
Potência~P=\frac{W}{t}~Watts (W) = joules por segundo
Momento de uma força~M=F\,d~d: distância do ponto de giro. Equilíbrio: soma dos momentos = 0
Alavanca~F_1\,d_1=F_2\,d_2~Força maior perto do eixo, menor longe
#Matemática
Produto de matrizes~c_{ij}=\sum_{k} a_{ik}\,b_{kj}~Elemento da linha i e coluna j = linha i de A × coluna j de B, somando os produtos
Determinante 2×2~\det\begin{pmatrix}a&b\\c&d\end{pmatrix}=ad-bc~Diagonal principal menos a secundária
Inversa 2×2~A^{-1}=\frac{1}{ad-bc}\begin{pmatrix}d&-b\\-c&a\end{pmatrix}~Troca a e d, muda o sinal de b e c. Só existe se det ≠ 0
Regra de três~\frac{a}{b}=\frac{c}{x}~Direta: multiplique em cruz. Inversa: inverta uma das razões
Aumento e desconto~\text{novo}=\text{valor}\times\left(1\pm\frac{p}{100}\right)~+ para aumento, − para desconto. Ex.: 20% a mais = × 1,20
Juros simples~J=C\,i\,t\qquad M=C+J~C: capital · i: taxa · t: tempo · M: montante
Juros compostos~M=C\,(1+i)^t~Juros sobre juros. Taxa e tempo na mesma unidade
Média aritmética~\bar{x}=\frac{x_1+x_2+\dots+x_n}{n}~Soma dos valores dividida pela quantidade
Média ponderada~\bar{x}_p=\frac{\sum x_i\,p_i}{\sum p_i}~p: peso de cada valor
Média geométrica~\sqrt[n]{x_1\cdot x_2\cdots x_n}~Raiz n-ésima do produto
Variância e desvio-padrão~\sigma^2=\frac{\sum (x_i-\bar{x})^2}{n}\qquad \sigma=\sqrt{\sigma^2}~Mede o quanto os dados se afastam da média
